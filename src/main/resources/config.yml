# OmniBridge Configuration
# Auto-manages ViaVersion, ViaBackwards, ViaRewind, Geyser, Floodgate and more

# Should OmniBridge auto-install managed plugins on startup?
auto-install: true

# Should OmniBridge auto-update plugins on startup?
auto-update: false

# Which plugins to manage (true = manage, false = skip)
# All plugins are disabled by default. Enable the ones you need, then run /ob reload
# Dependencies are auto-enabled (e.g. enabling Geyser auto-enables Floodgate)
managed-plugins:
  # ViaVersion family (cross-version support)
  viaversion: false
  viabackwards: false
  viarewind: false
  viarewind-legacysupport: false
  viaprilfools: false
  viabungee: false
  # GeyserMC family (cross-platform / Bedrock support)
  geyser: false
  floodgate: false
  hurricane: false
  geyserconnect: false
  thirdpartycosmetics: false
  thunderbeta: false
  rainbow: false
  # Integration plugins (Bedrock/cross-version aware)
  authme: false
  tab: false
  # Community essentials
  protocolib: false
  tuffxplus: false
  # Server essentials (cross-platform aware)
  luckperms: false
  essentialsx: false
  placeholderapi: false
  worldguard: false
  coreprotect: false

# Geyser Bedrock settings
bedrock:
  address: 0.0.0.0
  port: 19132

# Java server settings (for Geyser to connect to)
java:
  address: 127.0.0.1
  port: 25565

# Locale for messages (68 locales available, e.g. en_US, tr_TR, de_DE, zh_TW)
locale: en_US

# Enable debug logging
debug: false

# Reminder settings (broadcasts to ops when no plugins are configured)
reminder:
  # How often to remind (in minutes)
  interval-minutes: 5
