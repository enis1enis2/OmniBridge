# OmniBridge Configuration
# Auto-manages ViaVersion, ViaBackwards, ViaRewind, Geyser, Floodgate and more

# Should OmniBridge auto-install missing plugins on startup?
auto-install: true

# Should OmniBridge auto-update plugins on startup?
auto-update: false

# Which plugins to manage (true = manage, false = skip)
managed-plugins:
  # ViaVersion family (cross-version support)
  viaversion: true
  viabackwards: true
  viarewind: true
  viarewind-legacysupport: true
  viaprilfools: true
  # GeyserMC family (cross-platform support)
  geyser: true
  floodgate: true
  hurricane: true
  geyserconnect: true
  thirdpartycosmetics: true
  thunderbeta: true
  rainbow: true

# Geyser Bedrock settings
bedrock:
  address: 0.0.0.0
  port: 19132

# Java server settings (for Geyser to connect to)
java:
  address: 127.0.0.1
  port: 25565

# Enable debug logging
debug: false
