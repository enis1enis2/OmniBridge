name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update pom.xml version
        run: mvn versions:set -DnewVersion=${{ steps.version.outputs.VERSION }} -q

      - name: Build with Maven
        run: mvn clean package -q

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          PREV_TAG=$(git tag --sort=-v:refname | head -1 | grep -v "^${GITHUB_REF_NAME}$" || true)
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          # Write to multiline output
          {
            echo "CHANGELOG<<EOF"
            echo "### Changes"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "### Downloads"
            echo ""
            echo "| File | Description |"
            echo "|------|-------------|"
            echo "| \`OmniBridge-${{ steps.version.outputs.VERSION }}.jar\` | Plugin JAR - drop into \`plugins/\` folder |"
            echo ""
            echo "### Requirements"
            echo ""
            echo "- Java 21+"
            echo "- Minecraft 1.8+ (Paper/Spigot)"
            echo "- [PacketEvents 2.x](https://github.com/retrooper/packetevents) (included automatically)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "OmniBridge v${{ steps.version.outputs.VERSION }}"
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          files: target/OmniBridge-*.jar
          draft: false
          prerelease: false
