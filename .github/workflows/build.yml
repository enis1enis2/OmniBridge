name: Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -q

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniBridge-${{ github.sha }}
          path: target/OmniBridge-*.jar
          retention-days: 14
